<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>💱 CurrencySphere • Shariang Dev</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 30% 10%, #1e293b, #0f172a 85%);
      min-height: 100vh;
      padding: 16px 16px 30px;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .back-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f1f5f9;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(10px);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: rgba(34, 197, 94, 0.2);
      backdrop-filter: blur(12px);
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .logo-text {
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #bbf7d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-badge {
      background: rgba(251, 191, 36, 0.15);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #fbbf24;
      border: 1px solid rgba(251,191,36,0.2);
    }

    /* Kartu utama */
    .main-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 20px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
    }

    /* Input jumlah */
    .amount-section {
      margin-bottom: 16px;
    }

    .amount-label {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .amount-input-wrapper {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .amount-input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 28px;
      font-weight: 700;
      padding: 10px 0;
      font-family: 'Inter', sans-serif;
    }

    .amount-input-wrapper input::placeholder {
      color: #475569;
      font-size: 20px;
    }

    .currency-badge {
      background: rgba(34, 197, 94, 0.2);
      padding: 8px 14px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      color: #4ade80;
    }

    /* Selector mata uang */
    .currency-selectors {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .currency-select {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 12px 14px;
      color: #f1f5f9;
      font-weight: 600;
      font-size: 14px;
      outline: none;
      flex: 1;
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 12px center;
      cursor: pointer;
    }

    .swap-btn {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4ade80;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }

    /* Hasil konversi */
    .result-section {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      margin-bottom: 12px;
    }

    .result-label {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .result-amount {
      font-size: 36px;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: -1px;
      word-break: break-word;
    }

    .rate-info {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 8px;
    }

    /* Grid rate populer */
    .popular-rates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .rate-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 14px;
      text-align: center;
    }

    .rate-currency {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .rate-number {
      font-size: 18px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #475569;
      margin-top: 6px;
    }

    .footer span {
      color: #fbbf24;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div class="logo-area">
        <div class="logo-icon">💱</div>
        <div class="logo-text">CurrencySphere</div>
      </div>
      <div class="brand-badge">Shariang Dev</div>
    </div>

    <!-- Kartu Utama -->
    <div class="main-card">
      <!-- Input Jumlah -->
      <div class="amount-section">
        <div class="amount-label">Jumlah</div>
        <div class="amount-input-wrapper">
          <input type="number" id="amountInput" placeholder="1" value="1" min="0" step="any">
          <div class="currency-badge" id="fromBadge">USD</div>
        </div>
      </div>

      <!-- Selector Mata Uang -->
      <div class="currency-selectors">
        <select id="fromCurrency" class="currency-select">
          <option value="USD">🇺🇸 USD - Dolar AS</option>
          <option value="IDR">🇮🇩 IDR - Rupiah</option>
          <option value="EUR">🇪🇺 EUR - Euro</option>
          <option value="GBP">🇬🇧 GBP - Pound</option>
          <option value="JPY">🇯🇵 JPY - Yen</option>
          <option value="SGD">🇸🇬 SGD - Dolar Singapura</option>
          <option value="MYR">🇲🇾 MYR - Ringgit</option>
          <option value="AUD">🇦🇺 AUD - Dolar Australia</option>
          <option value="CNY">🇨🇳 CNY - Yuan</option>
          <option value="KRW">🇰🇷 KRW - Won</option>
        </select>
        
        <div class="swap-btn" id="swapCurrencyBtn">
          <i class="fas fa-exchange-alt"></i>
        </div>

        <select id="toCurrency" class="currency-select">
          <option value="IDR" selected>🇮🇩 IDR - Rupiah</option>
          <option value="USD">🇺🇸 USD - Dolar AS</option>
          <option value="EUR">🇪🇺 EUR - Euro</option>
          <option value="GBP">🇬🇧 GBP - Pound</option>
          <option value="JPY">🇯🇵 JPY - Yen</option>
          <option value="SGD">🇸🇬 SGD - Dolar Singapura</option>
          <option value="MYR">🇲🇾 MYR - Ringgit</option>
          <option value="AUD">🇦🇺 AUD - Dolar Australia</option>
          <option value="CNY">🇨🇳 CNY - Yuan</option>
          <option value="KRW">🇰🇷 KRW - Won</option>
        </select>
      </div>

      <!-- Hasil Konversi -->
      <div class="result-section">
        <div class="result-label">📊 Hasil Konversi</div>
        <div class="result-amount" id="resultAmount">Rp --</div>
        <div class="rate-info" id="rateInfo">1 USD = -- IDR</div>
      </div>

      <!-- Rate Populer -->
      <div class="popular-rates" id="popularRates">
        <div class="rate-card">
          <div class="rate-currency">🇺🇸 USD → 🇮🇩 IDR</div>
          <div class="rate-number" id="usdIdr">--</div>
        </div>
        <div class="rate-card">
          <div class="rate-currency">🇺🇸 USD → 🇪🇺 EUR</div>
          <div class="rate-number" id="usdEur">--</div>
        </div>
        <div class="rate-card">
          <div class="rate-currency">🇺🇸 USD → 🇸🇬 SGD</div>
          <div class="rate-number" id="usdSgd">--</div>
        </div>
        <div class="rate-card">
          <div class="rate-currency">🇺🇸 USD → 🇯🇵 JPY</div>
          <div class="rate-number" id="usdJpy">--</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <i class="far fa-dot-circle"></i> Powered by <span>Shariang Dev</span> • Kurs Real-Time
    </div>
  </div>

  <script>
    (function() {
      const amountInput = document.getElementById('amountInput');
      const fromCurrency = document.getElementById('fromCurrency');
      const toCurrency = document.getElementById('toCurrency');
      const fromBadge = document.getElementById('fromBadge');
      const swapCurrencyBtn = document.getElementById('swapCurrencyBtn');
      const resultAmount = document.getElementById('resultAmount');
      const rateInfo = document.getElementById('rateInfo');

      let ratesData = {};

      // Fetch rates dari API
      async function fetchRates(base = 'USD') {
        try {
          const response = await fetch(`https://open.er-api.com/v6/latest/${base}`);
          const data = await response.json();
          if (data && data.rates) {
            ratesData = data.rates;
            updateConversion();
            updatePopularRates();
            // Simpan cache
            localStorage.setItem('currencyRates', JSON.stringify({
              base: base,
              rates: data.rates,
              timestamp: Date.now()
            }));
          }
        } catch (error) {
          // Fallback ke cache
          const cached = localStorage.getItem('currencyRates');
          if (cached) {
            const parsed = JSON.parse(cached);
            ratesData = parsed.rates;
            updateConversion();
            updatePopularRates();
          }
        }
      }

      function updateConversion() {
        const amount = parseFloat(amountInput.value) || 0;
        const from = fromCurrency.value;
        const to = toCurrency.value;
        
        fromBadge.textContent = from;
        
        if (!ratesData[from] || !ratesData[to]) {
          resultAmount.textContent = '--';
          rateInfo.textContent = 'Data tidak tersedia';
          return;
        }

        // Konversi melalui USD sebagai base
        const rate = ratesData[to] / ratesData[from];
        const converted = amount * rate;
        
        // Format hasil
        const formatted = new Intl.NumberFormat('id-ID', {
          style: 'currency',
          currency: to,
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(converted);
        
        resultAmount.textContent = formatted;
        
        // Info rate
        const rateFormatted = new Intl.NumberFormat('id-ID', {
          style: 'currency',
          currency: to,
          minimumFractionDigits: 2,
          maximumFractionDigits: 4
        }).format(rate);
        
        rateInfo.textContent = `1 ${from} = ${rateFormatted}`;
      }

      function updatePopularRates() {
        if (!ratesData.IDR || !ratesData.EUR || !ratesData.SGD || !ratesData.JPY) return;
        
        const formatRate = (rate, currency) => {
          return new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: currency,
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }).format(rate);
        };

        document.getElementById('usdIdr').textContent = formatRate(ratesData.IDR, 'IDR');
        document.getElementById('usdEur').textContent = formatRate(ratesData.EUR, 'EUR');
        document.getElementById('usdSgd').textContent = formatRate(ratesData.SGD, 'SGD');
        document.getElementById('usdJpy').textContent = formatRate(ratesData.JPY, 'JPY');
      }

      // Event listeners
      amountInput.addEventListener('input', updateConversion);
      fromCurrency.addEventListener('change', () => {
        fetchRates(fromCurrency.value);
      });
      toCurrency.addEventListener('change', updateConversion);

      swapCurrencyBtn.addEventListener('click', () => {
        const temp = fromCurrency.value;
        fromCurrency.value = toCurrency.value;
        toCurrency.value = temp;
        fromBadge.textContent = fromCurrency.value;
        fetchRates(fromCurrency.value);
      });

      // Inisialisasi
      fetchRates('USD');
      
      // Refresh setiap 10 menit
      setInterval(() => fetchRates(fromCurrency.value), 600000);

    })();
  </script>
</body>
</html>
