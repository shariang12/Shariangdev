<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>🌐 LinguaSphere • Auto Translate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 80% 20%, #1e293b, #0f172a 90%);
      min-height: 100vh;
      padding: 16px 16px 30px;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: rgba(168, 85, 247, 0.2);
      backdrop-filter: blur(12px);
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .logo-text {
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #d8b4fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

    .auto-badge {
      background: rgba(34, 197, 94, 0.2);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      color: #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Kartu utama */
    .translate-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 20px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Bahasa selector */
    .lang-selectors {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .lang-select {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 12px 14px;
      color: #f1f5f9;
      font-weight: 600;
      font-size: 14px;
      outline: none;
      flex: 1;
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 12px center;
      cursor: pointer;
    }

    .swap-btn {
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d8b4fe;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(8px);
    }

    .swap-btn:active {
      transform: rotate(180deg);
      background: rgba(168, 85, 247, 0.5);
    }

    /* Area input teks */
    .text-area {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      padding: 6px;
      position: relative;
    }

    .text-area textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 16px;
      font-weight: 500;
      padding: 10px 12px;
      resize: none;
      min-height: 100px;
      font-family: 'Inter', sans-serif;
    }

    .text-area textarea::placeholder {
      color: #64748b;
    }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 12px 8px;
    }

    .char-count {
      font-size: 11px;
      color: #94a3b8;
    }

    .typing-indicator {
      font-size: 11px;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .typing-indicator.active {
      opacity: 1;
    }

    .typing-dot {
      width: 5px;
      height: 5px;
      background: #4ade80;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Hasil terjemahan */
    .result-box {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      padding: 16px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .result-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .result-text {
      font-size: 17px;
      font-weight: 500;
      color: #e2e8f0;
      word-break: break-word;
      line-height: 1.5;
      flex: 1;
    }

    .placeholder-text {
      color: #64748b;
      font-style: italic;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
    }

    .action-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;
      padding: 8px 14px;
      color: #cbd5e1;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: 0.2s;
    }

    .action-btn:active {
      background: rgba(168, 85, 247, 0.25);
      color: white;
    }

    /* Tombol terjemahkan (tetap ada untuk fallback) */
    .translate-btn {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 24px;
      padding: 16px;
      font-weight: 700;
      font-size: 16px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.4);
      transition: 0.2s;
      letter-spacing: 0.3px;
    }

    .translate-btn:active {
      transform: scale(0.97);
      background: linear-gradient(135deg, #6d28d9, #9333ea);
    }

    .translate-btn:disabled {
      opacity: 0.6;
      transform: none;
      pointer-events: none;
    }

    .info-text {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    .footer {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: #475569;
    }

    @media (max-width: 380px) {
      .lang-select {
        font-size: 13px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo-area">
        <div class="logo-icon">🌐</div>
        <div>
          <div class="logo-text">LinguaSphere</div>
          <div class="subtitle">Auto Translate</div>
        </div>
      </div>
      <div class="auto-badge">
        <i class="fas fa-bolt"></i> AUTO
      </div>
    </div>

    <!-- Kartu Translate Utama -->
    <div class="translate-card">
      <!-- Selektor bahasa -->
      <div class="lang-selectors">
        <select id="sourceLang" class="lang-select">
          <option value="id">🇮🇩 Indonesia</option>
          <option value="en">🇬🇧 Inggris</option>
          <option value="ja">🇯🇵 Jepang</option>
          <option value="ko">🇰🇷 Korea</option>
          <option value="zh-CN">🇨🇳 Mandarin</option>
          <option value="ar">🇸🇦 Arab</option>
          <option value="fr">🇫🇷 Prancis</option>
          <option value="de">🇩🇪 Jerman</option>
          <option value="es">🇪🇸 Spanyol</option>
          <option value="pt">🇧🇷 Portugis</option>
          <option value="ru">🇷🇺 Rusia</option>
          <option value="th">🇹🇭 Thailand</option>
          <option value="vi">🇻🇳 Vietnam</option>
          <option value="ms">🇲🇾 Melayu</option>
          <option value="nl">🇳🇱 Belanda</option>
        </select>
        
        <div class="swap-btn" id="swapBtn">
          <i class="fas fa-exchange-alt"></i>
        </div>

        <select id="targetLang" class="lang-select">
          <option value="en" selected>🇬🇧 Inggris</option>
          <option value="id">🇮🇩 Indonesia</option>
          <option value="ja">🇯🇵 Jepang</option>
          <option value="ko">🇰🇷 Korea</option>
          <option value="zh-CN">🇨🇳 Mandarin</option>
          <option value="ar">🇸🇦 Arab</option>
          <option value="fr">🇫🇷 Prancis</option>
          <option value="de">🇩🇪 Jerman</option>
          <option value="es">🇪🇸 Spanyol</option>
          <option value="pt">🇧🇷 Portugis</option>
          <option value="ru">🇷🇺 Rusia</option>
          <option value="th">🇹🇭 Thailand</option>
          <option value="vi">🇻🇳 Vietnam</option>
          <option value="ms">🇲🇾 Melayu</option>
          <option value="nl">🇳🇱 Belanda</option>
        </select>
      </div>

      <!-- Input teks -->
      <div class="text-area">
        <textarea id="inputText" placeholder="Ketik di sini... terjemahan otomatis muncul ✨" maxlength="800"></textarea>
        <div class="input-footer">
          <span class="char-count"><span id="charCount">0</span>/800</span>
          <span class="typing-indicator" id="typingIndicator">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            menerjemahkan
          </span>
        </div>
      </div>

      <!-- Hasil Terjemahan -->
      <div class="result-box">
        <div class="result-label">📝 Hasil Terjemahan</div>
        <div id="resultText" class="result-text placeholder-text">
          Mulai ketik untuk melihat terjemahan...
        </div>
        <div class="action-row">
          <button class="action-btn" id="copyBtn" title="Salin">
            <i class="far fa-copy"></i> Salin
          </button>
          <button class="action-btn" id="speakBtn" title="Dengarkan">
            <i class="fas fa-volume-up"></i> Suara
          </button>
          <button class="action-btn" id="clearBtn" title="Hapus">
            <i class="fas fa-eraser"></i> Hapus
          </button>
        </div>
      </div>

      <!-- Tombol terjemahkan manual (fallback) -->
      <button class="translate-btn" id="translateBtn">
        <i class="fas fa-language"></i> Terjemahkan Manual
      </button>
      
      <div class="info-text">
        <i class="fas fa-shield-alt"></i> Terjemahan otomatis • Ketik & lihat hasilnya
      </div>
    </div>

    <div class="footer">
      <i class="far fa-dot-circle"></i> LinguaSphere • Auto Translate Technology
    </div>
  </div>

  <script>
    (function() {
      // Elemen DOM
      const sourceLang = document.getElementById('sourceLang');
      const targetLang = document.getElementById('targetLang');
      const swapBtn = document.getElementById('swapBtn');
      const inputText = document.getElementById('inputText');
      const charCount = document.getElementById('charCount');
      const resultText = document.getElementById('resultText');
      const translateBtn = document.getElementById('translateBtn');
      const copyBtn = document.getElementById('copyBtn');
      const speakBtn = document.getElementById('speakBtn');
      const clearBtn = document.getElementById('clearBtn');
      const typingIndicator = document.getElementById('typingIndicator');

      // API gratis (MyMemory)
      const API_URL = 'https://api.mymemory.translated.net/get';
      
      let debounceTimer;
      let isTranslating = false;

      // Update jumlah karakter
      inputText.addEventListener('input', () => {
        const len = inputText.value.length;
        charCount.textContent = len;
        if (len > 750) {
          charCount.style.color = '#f87171';
        } else {
          charCount.style.color = '#94a3b8';
        }
      });

      // Fungsi terjemahkan (dipanggil oleh auto & manual)
      async function translateText(isAuto = false) {
        const text = inputText.value.trim();
        
        if (!text) {
          resultText.innerHTML = '<span class="placeholder-text">Mulai ketik untuk melihat terjemahan...</span>';
          resultText.classList.add('placeholder-text');
          hideTypingIndicator();
          return;
        }

        if (isTranslating) return; // Hindari double request
        
        isTranslating = true;
        if (isAuto) {
          showTypingIndicator();
        }
        
        const source = sourceLang.value;
        const target = targetLang.value;

        try {
          const response = await fetch(`${API_URL}?q=${encodeURIComponent(text)}&langpair=${source}|${target}`);
          const data = await response.json();
          
          if (data.responseStatus === 200) {
            const translated = data.responseData.translatedText;
            resultText.textContent = translated;
            resultText.classList.remove('placeholder-text');
          } else {
            resultText.innerHTML = '<span style="color:#f87171;">Gagal menerjemahkan</span>';
          }
        } catch (error) {
          // Jika offline/gagal, jangan timpa hasil sebelumnya
          if (!resultText.textContent || resultText.classList.contains('placeholder-text')) {
            resultText.innerHTML = '<span style="color:#f87171;">Kesalahan jaringan</span>';
          }
        } finally {
          isTranslating = false;
          hideTypingIndicator();
        }
      }

      // Fungsi auto-translate dengan debounce (500ms setelah berhenti mengetik)
      function autoTranslate() {
        clearTimeout(debounceTimer);
        const text = inputText.value.trim();
        
        if (!text) {
          resultText.innerHTML = '<span class="placeholder-text">Mulai ketik untuk melihat terjemahan...</span>';
          resultText.classList.add('placeholder-text');
          hideTypingIndicator();
          return;
        }
        
        // Tampilkan indikator mengetik
        showTypingIndicator();
        
        // Debounce 600ms
        debounceTimer = setTimeout(() => {
          translateText(true);
        }, 600);
      }

      function showTypingIndicator() {
        typingIndicator.classList.add('active');
      }

      function hideTypingIndicator() {
        typingIndicator.classList.remove('active');
      }

      // Event input untuk auto-translate
      inputText.addEventListener('input', autoTranslate);

      // Event perubahan bahasa -> langsung terjemahkan ulang
      sourceLang.addEventListener('change', () => {
        if (inputText.value.trim()) {
          autoTranslate();
        }
      });

      targetLang.addEventListener('change', () => {
        if (inputText.value.trim()) {
          autoTranslate();
        }
      });

      // Tombol terjemahkan manual (fallback)
      translateBtn.addEventListener('click', () => {
        clearTimeout(debounceTimer);
        translateText(false);
      });

      // Tombol swap bahasa
      swapBtn.addEventListener('click', () => {
        const tempSource = sourceLang.value;
        sourceLang.value = targetLang.value;
        targetLang.value = tempSource;
        
        // Jika ada teks, terjemahkan ulang
        if (inputText.value.trim()) {
          autoTranslate();
        }
      });

      // Tombol salin
      copyBtn.addEventListener('click', () => {
        const text = resultText.textContent;
        if (!text || resultText.classList.contains('placeholder-text')) {
          alert('Tidak ada hasil untuk disalin');
          return;
        }
        
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
          setTimeout(() => {
            copyBtn.innerHTML = '<i class="far fa-copy"></i> Salin';
          }, 1800);
        }).catch(() => {
          alert('Gagal menyalin teks');
        });
      });

      // Tombol suara (Text-to-Speech)
      speakBtn.addEventListener('click', () => {
        const text = resultText.textContent;
        if (!text || resultText.classList.contains('placeholder-text')) {
          alert('Tidak ada teks untuk dibacakan');
          return;
        }
        
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel(); // Hentikan suara sebelumnya
          const utterance = new SpeechSynthesisUtterance(text);
          
          // Deteksi bahasa untuk suara
          const langMap = {
            'id': 'id-ID', 'en': 'en-US', 'ja': 'ja-JP', 'ko': 'ko-KR',
            'zh-CN': 'zh-CN', 'ar': 'ar-SA', 'fr': 'fr-FR', 'de': 'de-DE',
            'es': 'es-ES', 'pt': 'pt-BR', 'ru': 'ru-RU', 'th': 'th-TH',
            'vi': 'vi-VN', 'ms': 'ms-MY', 'nl': 'nl-NL'
          };
          utterance.lang = langMap[targetLang.value] || 'en-US';
          utterance.rate = 0.9;
          
          speakBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Bicara...';
          utterance.onend = () => {
            speakBtn.innerHTML = '<i class="fas fa-volume-up"></i> Suara';
          };
          utterance.onerror = () => {
            speakBtn.innerHTML = '<i class="fas fa-volume-up"></i> Suara';
          };
          
          window.speechSynthesis.speak(utterance);
        } else {
          alert('Browser tidak mendukung Text-to-Speech');
        }
      });

      // Tombol hapus
      clearBtn.addEventListener('click', () => {
        inputText.value = '';
        charCount.textContent = '0';
        resultText.innerHTML = '<span class="placeholder-text">Mulai ketik untuk melihat terjemahan...</span>';
        resultText.classList.add('placeholder-text');
        hideTypingIndicator();
        clearTimeout(debounceTimer);
      });

    })();
  </script>
</body>
</html>
